apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ingress.yaml
images:
  - name: cloudbridge-app
    newName: REGISTRY/cloudbridge-app  # filled in by k8s/deploy.sh from Terraform outputs
    newTag: v1
patches:
  - path: backend-nlb.yaml
  # CLOUD=aws on both deployments (env index 1 in the base)
  - target: { kind: Deployment }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: aws
  # The frontend reaches the backend through private DNS, like an app calling a regional
  # AWS endpoint by name. Test 1 empties this record.
  - target: { kind: Deployment, name: frontend }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: http://backend.cloudbridge.internal:8080
